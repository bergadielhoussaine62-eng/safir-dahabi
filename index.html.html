<!DOCTYPE html>
<html lang="ar" dir="rtl" id="lang-root">
<head>
    <meta charset="UTF-8">
    <title>سفر الذهبي | وكالة الأسفار المعتمدة</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-white p-6 shadow-sm sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-2xl font-black text-yellow-600">🕋 سفر الذهبي</h1>
        <div class="flex gap-4 font-bold">
            <button onclick="setLang('ar')" class="hover:text-yellow-600">العربية</button>
            <button onclick="setLang('fr')" class="hover:text-yellow-600">Français</button>
        </div>
    </nav>

    <section class="py-16 max-w-6xl mx-auto px-4">
        <h2 id="branch-title" class="text-3xl font-black mb-12 text-center">فروعنا وأوقات العمل</h2>
        <div class="grid md:grid-cols-2 gap-8">
            
            <div class="bg-white p-6 rounded-2xl shadow border">
                <h3 class="font-bold text-xl text-yellow-700 mb-2">سلا الجديدة (Sala Al Jadida)</h3>
                <p class="text-gray-600 mb-4 text-sm">N° 5, Romana Garden, Av. Hassan 2, Magasin 30-26</p>
                <div class="h-48 w-full bg-gray-200 rounded-xl overflow-hidden">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3323.7711417535565!2d-6.738012!3d33.585501!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xda7b15a00000001%3A0x0!2sRomana+Garden!5e0!3m2!1sfr!2sma!4v1620000000000" width="100%" height="100%" frameborder="0"></iframe>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow border">
                <h3 class="font-bold text-xl text-yellow-700 mb-2">الدار البيضاء (Casablanca)</h3>
                <p class="text-gray-600 mb-4 text-sm">2 Rue Oulad Teima, Casablanca 20250</p>
                <div class="h-48 w-full bg-gray-200 rounded-xl overflow-hidden">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3324.2384!2d-7.6110!3d33.5891!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzPCsDM1JzIxLjAiTiA3wrAzNiczOS42Ilc!5e0!3m2!1sfr!2sma!4v1620000000000" width="100%" height="100%" frameborder="0"></iframe>
                </div>
            </div>

        </div>
    </section>

    <footer class="bg-gray-900 text-white py-12 px-4 text-center">
        <h4 class="font-bold text-yellow-500 mb-4">أوقات العمل</h4>
        <p>الاثنين - الثلاثاء: 09:00-13:00 | 15:00-18:00</p>
        <p>السبت: 09:00-13:00 | الأحد: مغلق</p>
        <p class="mt-6 text-gray-400">contact@voyageor.com</p>
    </footer>

    <script>
        function setLang(lang) {
            const root = document.getElementById('lang-root');
            root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            root.setAttribute('lang', lang);
        }
    </script>
</body>
</html>
