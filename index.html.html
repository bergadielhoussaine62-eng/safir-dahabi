<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <title>سفر الذهبي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <nav class="bg-white p-4 shadow flex justify-between items-center">
        <h1 class="text-2xl font-black text-yellow-600">سفر الذهبي</h1>
        <div>
            <button onclick="changeLang('ar')" class="font-bold p-2">العربية</button>
            <button onclick="changeLang('fr')" class="font-bold p-2">Français</button>
        </div>
    </nav>

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">
        <h2 id="form-title" class="text-xl font-bold mb-4 text-center">احجز مقعدك الآن</h2>
        <form action="https://formspree.io/f/xqeobgdl" method="POST" class="space-y-4">
            <input type="text" name="name" placeholder="الاسم الكامل" class="w-full p-2 border rounded" required>
            <select name="city" class="w-full p-2 border rounded">
                <option>سلا الجديدة</option>
                <option>الدار البيضاء</option>
                <option>القنيطرة</option>
                <option>أكادير</option>
            </select>
            <button type="submit" id="btn-submit" class="w-full bg-green-600 text-white p-2 rounded">إرسال الطلب</button>
        </form>
    </div>

    <div class="max-w-md mx-auto mt-10 p-4">
        <h2 id="faq-title" class="text-xl font-bold mb-4 text-center">أسئلة شائعة</h2>
        <div class="space-y-2">
            <details class="bg-white p-2 rounded"><summary class="font-bold cursor-pointer">الوثائق المطلوبة؟</summary><p>جواز سفر، صور، وتلقيح.</p></details>
            <details class="bg-white p-4 rounded"><summary class="font-bold cursor-pointer">أفضل وقت للعمرة؟</summary><p>طول السنة، ورمضان له مكانة خاصة.</p></details>
        </div>
    </div>

    <script>
        function changeLang(lang) {
            const root = document.getElementById('html-root');
            root.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('form-title').innerText = (lang === 'ar') ? "احجز مقعدك الآن" : "Réservez votre place";
            document.getElementById('btn-submit').innerText = (lang === 'ar') ? "إرسال الطلب" : "Envoyer";
            document.getElementById('faq-title').innerText = (lang === 'ar') ? "أسئلة شائعة" : "Questions fréquentes";
        }
    </script>
</body>
</html>
